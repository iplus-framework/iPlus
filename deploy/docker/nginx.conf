# nginx configuration for the iPlus browser client (Avalonia WASM).
#
# The WASM runtime needs the correct MIME types for .wasm/.dat/.blat and must
# not be served with long-lived caching for the boot files, otherwise a new
# release is not picked up by returning users.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Correct MIME types (nginx does not know .wasm/.dat/.blat by default).
    types {
        text/html                 html htm;
        text/css                  css;
        application/javascript    js mjs;
        application/json          json;
        application/wasm          wasm;
        application/octet-stream  dat blat pdb;
        image/png                 png;
        image/svg+xml             svg;
        image/x-icon              ico;
        font/woff                 woff;
        font/woff2                woff2;
        font/ttf                  ttf;
    }
    default_type application/octet-stream;

    # Compression for the large WASM payloads.
    gzip on;
    gzip_types application/wasm application/javascript application/json text/css text/html;
    gzip_min_length 1024;

    # Never cache the boot files: a new release must be picked up immediately.
    location ~* ^/(index\.html|main\.js|.*\.blat|.*\.dat|.*\.wasm)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Fingerprinted framework files can be cached.
    location ~* ^/framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
